# Shared Spring defaults; environment variables select local or production services.
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env.backend[.properties],optional:file:../.env.backend[.properties]
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.local-data/javac;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  # Flyway owns schema changes; Hibernate validates mappings instead of creating tables.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # Maven packages database/migrations into the classpath for versioned startup migrations.
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d}
      cookie:
        name: JAVAC_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
        max-age: ${SESSION_COOKIE_MAX_AGE:7d}
# JAVAC-specific settings consumed by services and security configuration.
# Account ownership checks may use Neon Auth; delivery handoff codes remain Java-managed.
app:
  approved-domains: ${APP_APPROVED_EMAIL_DOMAINS:srmap.edu.in}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  mail-from: ${MAIL_FROM:shanmukha_thiyyagura@srmap.edu.in}
  dev-mailbox: ${DEV_MAILBOX:./dev-mailbox}
  rate-limit: ${AUTH_RATE_LIMIT:30}

  admin-email: ${APP_ADMIN_EMAIL:shanmukha_thiyyagura@srmap.edu.in}
  neon-auth-url: ${NEON_AUTH_URL:${NEON_AUTH_BASE_URL:}}
  verification-mode: ${AUTH_VERIFICATION_MODE:otp}

logging:
  level:
    org.hibernate.orm.incubating: ERROR
