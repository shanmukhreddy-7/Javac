spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/javac?serverTimezone=UTC}
    username: ${DB_USER:javac}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JAVAC_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
app:
  approved-domains: ${APP_APPROVED_EMAIL_DOMAINS:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  mail-from: ${MAIL_FROM:noreply@example.edu}
  dev-mailbox: ${DEV_MAILBOX:./dev-mailbox}
  rate-limit: ${AUTH_RATE_LIMIT:30}
