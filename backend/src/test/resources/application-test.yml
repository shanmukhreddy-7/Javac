spring:
  datasource:
    url: jdbc:h2:mem:javac;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
app:
  approved-domains: example.edu
  rate-limit: 10000
